schema_version: 1
metadata:
  id: example-four-rotor-tiltrotor
  name: Example Four-Rotor Tiltrotor
  revision: 1
  vehicle_class: UAM
  description: Simulation profile template; replace example values with measured data.
aircraft:
  architecture: tiltrotor
  mass_properties:
    component_masses_kg:
      fuselage: 3.0
      wing: 1.0
      vtail: 0.5
      motor: 0.125
    center_of_gravity_m: [0.0, 0.0, 0.0]
    inertia_tensor_kg_m2:
      - [0.15, 0.0, 0.0]
      - [0.0, 0.25, 0.0]
      - [0.0, 0.0, 0.4]
  geometry:
    fuselage:
      length_m: 1.6
      width_m: 0.12
      height_m: 0.14
    tilt_axis_xz_m: [0.1, 0.0]
    wing:
      root_le_x_m: 0.10
      root_y_m: 0.0
      tip_le_x_m: 0.05
      tip_y_m: 1.0
      root_chord_m: 0.40
      tip_chord_m: 0.20
      sweep_deg: 0.0
    rotors:
      - id: front_left
        position_m: [0.3, 0.4, 0.0]
        tilt_enabled: true
      - id: front_right
        position_m: [0.3, -0.4, 0.0]
        tilt_enabled: true
      - id: rear_left
        position_m: [-0.3, 0.4, 0.0]
        tilt_enabled: false
      - id: rear_right
        position_m: [-0.3, -0.4, 0.0]
        tilt_enabled: false
    vtail:
      root_x_m: -0.6
      tip_x_m: -0.5
      tip_y_m: 0.3
      tip_z_m: -0.15
      area_m2: 0.1
      arm_m: 0.5
  propulsion:
    battery:
      cells: 6
      capacity_mah: 5000
      c_rating: 30
      nominal_voltage_v: 22.2
    motor:
      kv_rpm_per_volt: 920
      maximum_rpm: 3000
      mass_kg: 0.125
      resistance_ohm: null
      inductance_h: null
    propeller:
      diameter_in: 12.0
      pitch_in: 5.5
      blade_count: 2
      thrust_coefficient_n_s2_rad2: 1.0e-5
      torque_coefficient_nm_s2_rad2: null
    motor_dynamics:
      time_constant_s: null
      slew_rate_rpm_s: null
    rotors:
      count: 4
      thrust_model: quadratic
      ground_effect_model: enabled
  aerodynamics:
    reference_area_m2: 0.6
    aspect_ratio: 5.0
    zero_lift_drag_coefficient: 0.02
    lift_curve_slope_per_rad: 4.0
    stall_angle_deg: 15.0
    airfoil_data_file: null
  actuators:
    tilt:
      maximum_rate_deg_s: 30.0
      angle_limits_deg: [0.0, 90.0]
      feedback_sensor: null
    control_surfaces:
      - id: left_tail
        type: vtail
        maximum_deflection_deg: 11.5
        rate_limit_deg_s: 300.0
        fail_position_deg: 0.0
      - id: right_tail
        type: vtail
        maximum_deflection_deg: 11.5
        rate_limit_deg_s: 300.0
        fail_position_deg: 0.0
  sensors:
    imu:
      model: unspecified
      update_rate_hz: null
      noise_density: null
      bias_stability: null
    air_data:
      model: unspecified
      update_rate_hz: null
      calibrated_airspeed_source: simulated
    gnss:
      model: unspecified
      update_rate_hz: null
      accuracy_m: null
  control:
    altitude_pid: {kp: 1.5, ki: 0.05, kd: 0.1}
    speed_pid: {kp: 0.1, ki: 0.0, kd: 0.01}
    attitude_pid: {kp: 1.0, ki: 0.0, kd: 0.05}
    rate_pid: {kp: 0.5, ki: 0.0, kd: 0.01}
    hover_rate_scale: 1.5
    cruise_rate_scale: 0.75
    allocation:
      method: bounded_least_squares
      effectiveness_data_source: simulated
      actuator_order: [front_left, front_right, rear_left, rear_right, left_tail, right_tail]
  transition:
    max_tilt_rate_deg_s: 30.0
    observer_time_constant_s: 0.25
    max_alpha_deg: 15.0
    max_pitch_deg: 60.0
    max_body_rate_deg_s: 180.0
    speed_margin_mps: 0.5
    envelope:
      airspeed_tilt_points: []
      source: simulation_estimate
  disturbance:
    enabled: true
    model: Finite-duration gust
    start_s: 5.0
    duration_s: 2.0
    magnitude_mps: 6.0
    direction: Front
    dryden_sigma_mps: 2.5
    dryden_tau_s: 1.0
  environment:
    air_density_kg_m3: 1.225
    gravity_m_s2: 9.81
  failures:
    supported_actuator_faults: [rotor_effectiveness, tilt_actuator, control_surface]
    sensor_faults: []
hardware:
  autopilot: PX4
  protocol: MAVLink
  execution_mode: bench_hil
  endpoint: udp://127.0.0.1:14550
  actuator_outputs_enabled: false
extensions: {}
